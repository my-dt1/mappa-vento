<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mappa del vento - Sardegna</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.css">
<style>html,body,#map{height:100%;margin:0}#bar{position:absolute;z-index:1000;left:12px;right:12px;bottom:18px;background:#fffc;padding:8px 12px;border-radius:6px;font:14px sans-serif;display:flex;gap:10px;align-items:center}#bar input[type=range]{flex:1}#legend{flex-wrap:wrap;max-width:260px;position:absolute;z-index:1000;right:12px;top:12px;background:#fffc;padding:6px 10px;border-radius:6px;font:12px sans-serif;display:flex;gap:6px;align-items:center}#legend i{width:120px;height:10px;border-radius:2px}</style>
</head><body>
<div id="map"></div>
<div id="legend"><span>0</span><i style="background:linear-gradient(90deg,#313695,#4575b4,#2c9fb8,#41ab5d,#e8a317,#f46d43,#d73027,#a50026)"></i><span>12+ m/s</span><br><span>Pioggia (mm/giorno)</span><i style="width:200px;background:linear-gradient(90deg,#deebf7,#c6dbef,#9ecae1,#6baed6,#3182bd,#08519c,#6a51a3,#54278f,#3f007d)"></i><span>0,2</span><span>80+</span></div>
<div id="bar"><select id="day"></select><button id="pgiorni" title="scorri i giorni">▶ giorni</button><label><input type="checkbox" id="windOn" checked> Vento</label><label><input type="checkbox" id="rainOn" checked> Pioggia</label><button id="play">▶</button><input id="t" type="range" min="0" value="0"><span id="lbl"></span></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js"></script>
<script>
const map = L.map("map").setView([40.1, 9.0], 8);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {attribution: "© OpenStreetMap", maxZoom: 12}).addTo(map);
const COLORI = ["#313695","#4575b4","#2c9fb8","#41ab5d","#e8a317","#f46d43","#d73027","#a50026"];  // debole -> forte
const STEP_MS = 5000;  // durata di ogni ora
let layer, frames, timer;
const daySel = document.getElementById("day"), windOn = document.getElementById("windOn");
const slider = document.getElementById("t"), lbl = document.getElementById("lbl"), play = document.getElementById("play");
function show(i) {
  if (layer) map.removeLayer(layer);
  const f = frames[i];
  slider.value = i;
  lbl.textContent = `${f[0].header.refTime.slice(11, 16)} · ${f[0].header.nstazioni} stazioni`;
  if (!windOn.checked) { layer = null; return; }
  layer = L.velocityLayer({data: f, velocityScale: 0.01, minVelocity: 0, maxVelocity: 12, lineWidth: 2.5, particleAge: 120, colorScale: COLORI, displayValues: true,
    displayOptions: {velocityType: "Vento", position: "bottomleft", emptyString: "nessun dato", speedUnit: "ms"}}).addTo(map);
}
const rainLayer = L.layerGroup().addTo(map), rainOn = document.getElementById("rainOn");
let rain;
fetch("data/sardegna.geojson").then(r => r.json()).then(g => L.geoJSON(g, {interactive: false, style: {color: "#444", weight: 1, fill: false}}).addTo(map)).catch(() => {});
const LIV = [0.2, 1, 2, 5, 10, 20, 35, 50, 80];  // mm, come in scripts/contour_rain.py
const BLU = ["#deebf7", "#c6dbef", "#9ecae1", "#6baed6", "#3182bd", "#08519c", "#6a51a3", "#54278f", "#3f007d"];
let iso;
function drawRain() {
  rainLayer.clearLayers();
  if (!rain || !rainOn.checked) return;
  const i = rain.giorni.indexOf(daySel.value);
  if (i < 0) return;
  const g = iso && iso[daySel.value];
  if (g) {
    L.geoJSON(g.bande, {interactive: false, style: f => ({stroke: false, fillColor: BLU[LIV.indexOf(f.properties.da)], fillOpacity: 0.45})}).addTo(rainLayer);
    L.geoJSON(g.linee, {interactive: false, style: {color: "#08306b", weight: 1, opacity: 0.7}}).addTo(rainLayer);
  }
  for (const s of rain.stazioni) {
    const mm = s.mm[i];
    if (mm == null) continue;  // dato mancante: non è 0 mm
    L.circleMarker([s.lat, s.lon], {radius: 3, color: "#08306b", weight: 1, fillColor: mm > 0 ? "#fff" : "#999", fillOpacity: 0.9})
      .bindTooltip(`${s.nome}: ${mm} mm`).addTo(rainLayer);
  }
}
rainOn.onchange = drawRain;
Promise.all([fetch("data/rain.json"), fetch("data/rain-iso.json")].map(f => f.then(r => r.ok ? r.json() : null)))
  .then(([r, g]) => { rain = r; iso = g; drawRain(); }).catch(() => {});
let dayTimer;
document.getElementById("pgiorni").onclick = e => {
  if (dayTimer) { clearInterval(dayTimer); dayTimer = null; e.target.textContent = "▶ giorni"; return; }
  e.target.textContent = "⏸ giorni";
  dayTimer = setInterval(() => { daySel.selectedIndex = (daySel.selectedIndex + 1) % daySel.options.length; daySel.onchange(); }, 4000);
};
function load(day) {
  drawRain();
  return fetch(`data/wind-${day}.json`).then(r => r.json()).then(d => { frames = d; slider.max = d.length - 1; show(0); });
}
slider.oninput = () => show(+slider.value);
windOn.onchange = () => show(+slider.value);
play.onclick = () => {
  if (timer) { clearInterval(timer); timer = null; play.textContent = "▶"; return; }
  play.textContent = "⏸"; timer = setInterval(() => show((+slider.value + 1) % frames.length), STEP_MS);
};
daySel.onchange = () => load(daySel.value);
fetch("data/days.json").then(r => r.json()).then(days => {
  daySel.innerHTML = days.map(d => `<option>${d}</option>`).join("");
  const q = new URLSearchParams(location.search).get("day");
  daySel.value = days.includes(q) ? q : days[0];
  load(daySel.value);
});
</script></body></html>
